<!DOCTYPE html>
<html lang="en" class="theme-grunge">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Tracy Tran</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

  <body class="theme-grunge">
    <!-- Nav -->
    <nav class="nav" aria-label="Primary">
      <a class="nav__brand" href="index.html">Tracy Tran</a>
      <ul class="nav__links">
        <li><a href="index.html#home">About</a></li>
        <li><a href="works.html">Works</a></li>
        <li><a href="contacts.html" aria-current="page">Contacts</a></li>
      </ul>
    </nav>

    <main class="contacts" id="content">
      <!-- Left: form -->
      <section class="card card--halo panel" aria-labelledby="c-title">
        <h1 id="c-title" class="title">Let’s talk!</h1>
        <p class="subtitle">Commissions • collaboration • questions</p>

        <form
          class="contact"
          id="contactForm"
          name="contact"
          method="POST"
          data-formspree="https://formspree.io/f/xdkdqjjp"
        >
          <div class="row">
            <div>
              <label for="name">Your name</label>
              <div class="field">
                <input id="name" name="name" autocomplete="name" required />
              </div>
              <p class="error">Please enter your name.</p>
            </div>
            <div>
              <label for="email">Email</label>
              <div class="field">
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                />
              </div>
              <p class="error">Please enter a valid email.</p>
            </div>
          </div>

          <div>
            <label for="subject">Subject</label>
            <div class="field">
              <input id="subject" name="subject" autocomplete="on" required />
            </div>
            <p class="error">Please add a subject.</p>
          </div>

          <div>
            <label for="message">Message</label>
            <div class="field">
              <textarea
                id="message"
                name="message"
                maxlength="1200"
                required
              ></textarea>
            </div>
            <div class="helpline">
              <span>Be as detailed as you like.</span>
              <span class="counter"><span id="count">0</span>/1200</span>
            </div>
            <p class="error">Tell me a little about your project.</p>
          </div>

          <div style="display: flex; gap: 10px; flex-wrap: wrap">
            <button class="btn" type="submit">Send</button>
            <button class="btn btn--ghost" type="button" id="mailtoBtn">
              Open mail app
            </button>
          </div>
        </form>
      </section>

      <!-- Right: info/socials -->
     <aside class="card panel" aria-labelledby="r-title">
  <h2 id="r-title" class="title">Others</h2>

  <div class="contact-info">
    <div class="info-row">
      <span class="label-text">Email</span>
      <code id="theEmail">trankhanhchiwork@gmail.com</code>
      <button class="btn" id="copyBtn">Copy</button>
    </div>
    </div>
</aside>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        const f = document.getElementById("contactForm");
        const message = document.getElementById("message");
        const count = document.getElementById("count");
        const emailEl = document.getElementById("theEmail");
        const toast = document.getElementById("toast");
        const formspree = f.getAttribute("data-formspree")?.trim();

        // autosize textarea + counter
        function autosize() {
          message.style.height = "auto";
          message.style.height = Math.min(message.scrollHeight, 420) + "px";
          count.textContent = message.value.length;
        }
        ["input", "change"].forEach((ev) =>
          message.addEventListener(ev, autosize)
        );
        autosize();

        // simple validation
        function setInvalid(input, invalid) {
          const field = input.closest(".field");
          if (!field) return;
          field.classList.toggle("invalid", invalid);
        }
        f.addEventListener("input", (e) => {
          const t = e.target;
          if (t.matches("input[required], textarea[required]")) {
            const bad =
              !t.value.trim() ||
              (t.type === "email" &&
                !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t.value));
            setInvalid(t, bad);
          }
        });

        function showToast(msg) {
          toast.textContent = msg;
          toast.classList.add("show");
          setTimeout(() => toast.classList.remove("show"), 1800);
        }

        // copy email
        document
          .getElementById("copyBtn")
          .addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(emailEl.textContent.trim());
              showToast("Email copied");
            } catch {
              showToast("Unable to copy");
            }
          });

        // mailto fallback
        document.getElementById("mailtoBtn").addEventListener("click", () => {
          const addr = emailEl.textContent.trim();
          const subj = encodeURIComponent(
            document.getElementById("subject").value || "Hello"
          );
          const body = encodeURIComponent(message.value || "");
          window.location.href = `mailto:${addr}?subject=${subj}&body=${body}`;
        });

        // submit: Formspree if configured, else just mailto notice
        f.addEventListener(
          "submit",
          async (e) => {
            e.preventDefault();

            const required = ["name", "email", "subject", "message"].map((id) =>
              document.getElementById(id)
            );
            let bad = false;
            required.forEach((el) => {
              const invalid =
                !el.value.trim() ||
                (el.type === "email" &&
                  !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(el.value));
              setInvalid(el, invalid);
              bad = bad || invalid;
            });
            if (bad) {
              showToast("Please fix the highlighted fields");
              return;
            }

            if (formspree && formspree.startsWith("https://")) {
              try {
                const data = new FormData(f);
                const res = await fetch(formspree, {
                  method: "POST",
                  body: data,
                  headers: { Accept: "application/json" },
                });
                if (res.ok) {
                  f.reset();
                  autosize();
                  showToast("Message sent — thank you!");
                } else {
                  showToast("Couldn’t send. Try mail app.");
                }
              } catch {
                showToast("Network error. Try mail app.");
              }
            } else {
              showToast("No form service set — opening mail app.");
              document.getElementById("mailtoBtn").click();
            }
          },
          { passive: false }
        );
      })();
    </script>
  </body>
</html>
